# Production preview pipeline: build image → push digest → upsert PreviewEnvironment.
# Secrets: KUBE_CONFIG (base64 kubeconfig for mirage-ci SA in mirage-system)
# Optional vars: PREVIEW_INGRESS_ENABLED, PREVIEW_INGRESS_HOST, PREVIEW_INGRESS_CLASS
name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  PE_NAME: pr-${{ github.event.pull_request.number }}
  PE_NAMESPACE: mirage-system
  TARGET_NAMESPACE: preview-pr-${{ github.event.pull_request.number }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/preview

jobs:
  build-and-preview:
    name: Build and preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.event.pull_request.head.sha }}
          # digests are exposed on steps.build.outputs.digest

      - name: Resolve image digest ref
        id: meta
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "docker/build-push-action did not emit a digest" >&2
            exit 1
          fi
          REF="${IMAGE_NAME}@${DIGEST}"
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${REF}"

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "secrets.KUBE_CONFIG is required (base64-encoded kubeconfig)" >&2
            exit 1
          fi
          echo "$KUBE_CONFIG" | base64 -d > "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"
          chmod 600 "${RUNNER_TEMP}/kubeconfig"

      - name: Apply PreviewEnvironment
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          INGRESS_ENABLED: ${{ vars.PREVIEW_INGRESS_ENABLED }}
          INGRESS_HOST: ${{ vars.PREVIEW_INGRESS_HOST }}
          INGRESS_CLASS: ${{ vars.PREVIEW_INGRESS_CLASS }}
        run: |
          set -euo pipefail
          MANIFEST="${RUNNER_TEMP}/previewenvironment.yaml"
          cat > "$MANIFEST" <<EOF
          apiVersion: mirage.dev/v1alpha1
          kind: PreviewEnvironment
          metadata:
            name: ${PE_NAME}
            namespace: ${PE_NAMESPACE}
            labels:
              mirage.dev/pr: "${{ github.event.pull_request.number }}"
              app.kubernetes.io/managed-by: mirage-ci
          spec:
            image: ${IMAGE_REF}
            targetNamespace: ${TARGET_NAMESPACE}
            ttlSeconds: 86400
            containerPort: 8080
            backend: direct
            source:
              repo: ${{ github.server_url }}/${{ github.repository }}
              pullRequest: ${{ github.event.pull_request.number }}
              commitSHA: ${{ github.event.pull_request.head.sha }}
          EOF
          # Strip leading spaces from the heredoc so kubectl gets valid YAML
          sed -i 's/^          //' "$MANIFEST"

          if [ "${INGRESS_ENABLED:-}" = "true" ]; then
            HOST="${INGRESS_HOST:-pr-${{ github.event.pull_request.number }}.preview.example.com}"
            {
              echo "  ingress:"
              echo "    enabled: true"
              echo "    host: ${HOST}"
              if [ -n "${INGRESS_CLASS:-}" ]; then
                echo "    ingressClassName: ${INGRESS_CLASS}"
              fi
            } >> "$MANIFEST"
          fi

          kubectl apply -f "$MANIFEST"

      - name: Wait for Ready
        id: wait
        run: |
          set -euo pipefail
          TIMEOUT_SECS=600
          DEADLINE=$((SECONDS + TIMEOUT_SECS))
          echo "Waiting for PreviewEnvironment/${PE_NAME} status.phase=Ready (timeout ${TIMEOUT_SECS}s)"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            PHASE=$(kubectl -n "$PE_NAMESPACE" get previewenvironment "$PE_NAME" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)
            URL=$(kubectl -n "$PE_NAMESPACE" get previewenvironment "$PE_NAME" \
              -o jsonpath='{.status.url}' 2>/dev/null || true)
            echo "phase=${PHASE:-<empty>} url=${URL:-<none>}"
            if [ "$PHASE" = "Ready" ]; then
              echo "url=${URL}" >> "$GITHUB_OUTPUT"
              echo "phase=${PHASE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$PHASE" = "Failed" ]; then
              echo "PreviewEnvironment entered Failed phase" >&2
              kubectl -n "$PE_NAMESPACE" get previewenvironment "$PE_NAME" -o yaml >&2 || true
              echo "url=${URL}" >> "$GITHUB_OUTPUT"
              echo "phase=${PHASE}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            # Prefer kubectl wait when available; fall back to poll above
            if kubectl -n "$PE_NAMESPACE" wait --for=jsonpath='{.status.phase}'=Ready \
              "previewenvironment/${PE_NAME}" --timeout=15s 2>/dev/null; then
              URL=$(kubectl -n "$PE_NAMESPACE" get previewenvironment "$PE_NAME" \
                -o jsonpath='{.status.url}' 2>/dev/null || true)
              echo "url=${URL}" >> "$GITHUB_OUTPUT"
              echo "phase=Ready" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Timed out waiting for Ready" >&2
          kubectl -n "$PE_NAMESPACE" get previewenvironment "$PE_NAME" -o yaml >&2 || true
          exit 1

      - name: Upsert PR preview comment
        if: always() && steps.wait.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.wait.outputs.url }}
          PHASE: ${{ steps.wait.outputs.phase }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
        run: |
          set -euo pipefail
          MARKER='<!-- mirage-preview -->'
          PR=${{ github.event.pull_request.number }}
          if [ "$WAIT_OUTCOME" = "success" ]; then
            BODY=$(printf '%s\n### Mirage preview\n\n| | |\n|---|---|\n| **Status** | Ready |\n| **URL** | %s |\n| **Image** | `%s` |\n| **Namespace** | `%s` |\n' \
              "$MARKER" "${PREVIEW_URL:-_(ingress not configured)_}" "$IMAGE_REF" "$TARGET_NAMESPACE")
          else
            BODY=$(printf '%s\n### Mirage preview\n\nPreviewEnvironment **%s** did not become Ready (phase: `%s`).\n\nImage: `%s`\n\nThe AI advisory workflow may post a failure summary shortly.\n' \
              "$MARKER" "$PE_NAME" "${PHASE:-unknown}" "$IMAGE_REF")
          fi

          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -f body="$BODY"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${PR}/comments" \
              -f body="$BODY"
          fi

  cleanup:
    name: Cleanup preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "secrets.KUBE_CONFIG is required (base64-encoded kubeconfig)" >&2
            exit 1
          fi
          echo "$KUBE_CONFIG" | base64 -d > "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"
          chmod 600 "${RUNNER_TEMP}/kubeconfig"

      - name: Delete PreviewEnvironment
        run: |
          kubectl -n "$PE_NAMESPACE" delete previewenvironment "$PE_NAME" --ignore-not-found
          echo "Deleted PreviewEnvironment/${PE_NAME} (target namespace cleaned by controller finalizer)"
