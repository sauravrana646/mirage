{{- if .Values.webhook.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mirage.webhookServiceName" . }}
  namespace: {{ include "mirage.namespace" . }}
  labels:
    {{- include "mirage.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
      name: https
  selector:
    {{- include "mirage.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "mirage.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "mirage.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "mirage.webhookCAInject" . | quote }}
  {{- end }}
webhooks:
  - name: vpreviewenvironment-v1alpha1.kb.io
    admissionReviewVersions: [v1]
    clientConfig:
      service:
        name: {{ include "mirage.webhookServiceName" . }}
        namespace: {{ include "mirage.namespace" . }}
        path: /validate-mirage-dev-v1alpha1-previewenvironment
        port: 443
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    sideEffects: None
    rules:
      - apiGroups: [mirage.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [previewenvironments]
        scope: Namespaced
{{- if .Values.webhook.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "mirage.fullname" . }}-selfsigned-issuer
  namespace: {{ include "mirage.namespace" . }}
  labels:
    {{- include "mirage.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mirage.fullname" . }}-serving-cert
  namespace: {{ include "mirage.namespace" . }}
  labels:
    {{- include "mirage.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ printf "%s.%s.svc" (include "mirage.webhookServiceName" .) (include "mirage.namespace" .) | quote }}
    - {{ printf "%s.%s.svc.cluster.local" (include "mirage.webhookServiceName" .) (include "mirage.namespace" .) | quote }}
  issuerRef:
    kind: Issuer
    name: {{ include "mirage.fullname" . }}-selfsigned-issuer
  secretName: {{ include "mirage.webhookCertSecretName" . }}
  {{- with .Values.webhook.certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.webhook.certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
