{{- if .Values.metrics.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mirage.metricsServiceName" . }}
  namespace: {{ include "mirage.namespace" . }}
  labels:
    {{- include "mirage.labels" . | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metrics.service.type }}
  ports:
    - name: https
      port: {{ .Values.metrics.service.port }}
      protocol: TCP
      targetPort: https
  selector:
    {{- include "mirage.selectorLabels" . | nindent 4 }}
{{- end }}
