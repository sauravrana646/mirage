# Default values for mirage.
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

# Install into mirage-system by default (helm install -n mirage-system --create-namespace).
namespaceOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/sauravrana646/mirage
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Prefer digest in production: sha256:...
  digest: ""

imagePullSecrets: []

serviceAccount:
  create: true
  # If not set and create is true, defaults to "controller-manager".
  name: controller-manager
  annotations: {}
  automount: true

# Restricted Pod Security Standards defaults.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Extra labels / annotations applied to the controller pods.
podLabels: {}
podAnnotations:
  kubectl.kubernetes.io/default-container: manager

# Controller manager arguments.
controller:
  # Leader election is required for HA (replicaCount > 1).
  leaderElect: true
  healthProbeBindAddress: ":8081"
  metricsBindAddress: ":8443"
  metricsSecure: true
  # Additional raw args appended after the defaults above.
  extraArgs: []

webhook:
  # ValidatingWebhookConfiguration for PreviewEnvironment CREATE/UPDATE.
  enabled: true
  failurePolicy: Fail
  # cert-manager Certificate + Issuer for webhook serving certs.
  certManager:
    enabled: true
    # Duration / renewBefore are optional; leave empty for cert-manager defaults.
    duration: ""
    renewBefore: ""

metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8443
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    # When true, skip TLS verification (dev only). Prefer cert-manager for prod.
    insecureSkipVerify: true
  networkPolicy:
    # Restrict metrics ingress to namespaces labeled metrics=enabled.
    enabled: false

# Optional Argo CD Application RBAC for the argocd backend (phase 6).
argoCD:
  rbac:
    enabled: true

# Priority class for the manager pods (optional).
priorityClassName: ""

terminationGracePeriodSeconds: 10
